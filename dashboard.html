<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol Paneli - Öğrenci Otomasyon Sistemi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-color: #8b5cf6;
            --secondary-color: #d946ef;
            --text-primary: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: rgba(255, 255, 255, 0.04);
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* Background glowing light orbs */
        .glow-orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
        }
        .orb-1 {
            background: var(--primary-color);
            top: -10%;
            left: -10%;
        }
        .orb-2 {
            background: var(--secondary-color);
            bottom: -10%;
            right: -10%;
        }

        /* Navbar */
        .navbar-custom {
            background: rgba(11, 15, 25, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #a78bfa 0%, #d946ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: #ef4444;
        }

        /* Layout container */
        .dashboard-container {
            padding: 40px 0;
        }

        /* Cards */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            height: 100%;
        }

        .card-title-custom {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        .card-title-custom svg {
            color: #a78bfa;
        }

        /* Form Styles */
        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-control-custom {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control-custom::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
            outline: none;
        }

        .form-control-custom:focus + .input-icon {
            color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
            opacity: 0.95;
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Custom Table Styles */
        .table-responsive-custom {
            overflow-x: auto;
        }

        .table-custom {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-top: -10px;
        }

        .table-custom th {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 16px;
        }

        .table-custom tr {
            transition: transform 0.2s ease;
        }

        .table-custom tbody tr:hover {
            transform: translateY(-2px);
        }

        .table-custom td {
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 16px;
            color: var(--text-primary);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        .table-custom td:first-child {
            border-left: 1px solid var(--border-color);
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
            color: var(--text-muted);
            font-weight: 500;
            width: 80px;
        }

        .table-custom td:last-child {
            border-right: 1px solid var(--border-color);
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .avatar-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2) 0%, rgba(217, 70, 239, 0.2) 100%);
            border: 1px solid rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a78bfa;
        }

        .badge-custom {
            background: rgba(139, 92, 246, 0.1);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.25);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-block;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            color: var(--text-muted);
            opacity: 0.4;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .empty-state span {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Ambient background light effects -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <!-- Navigation Header -->
    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="brand-container">
                <!-- Graduate Cap Logo -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="32" height="32" style="fill: url(#gradNavbar);">
                    <defs>
                        <linearGradient id="gradNavbar" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M12 2L1 8l11 6 9-4.91V17h2V8L12 2z"/>
                    <path d="M4.14 11.52v4.86c0 1.94 3.52 3.52 7.86 3.52s7.86-1.58 7.86-3.52v-4.86L12 15.9l-7.86-4.38z"/>
                </svg>
                <h1 class="brand-title">Öğrenci Otomasyonu</h1>
            </div>
            <a href="/" class="btn-logout">
                <!-- Logout Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
                </svg>
                Çıkış Yap
            </a>
        </div>
    </nav>

    <!-- Main Dashboard Body -->
    <div class="container dashboard-container">
        <div class="row g-4">
            
            <!-- Left Side: Add Student Form -->
            <div class="col-lg-4">
                <div class="glass-card">
                    <h3 class="card-title-custom">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="20" height="20">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0zM3 19.235v-.11a6 6 0 0 1 6-6h.75a6 6 0 0 1 6 6v.11c0 .35-.043.697-.127 1.037A12.01 12.01 0 0 1 9.5 20.75c-3.116 0-5.96-.1-8.593-.284A1.036 1.036 0 0 1 3 19.235z" />
                        </svg>
                        Yeni Öğrenci Ekle
                    </h3>
                    <form method="POST" action="/add">
                        <div class="input-group-custom">
                            <input class="form-control-custom" name="name" placeholder="Öğrenci Adı Soyadı" required autocomplete="off">
                            <!-- User SVG Icon -->
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        
                        <div class="input-group-custom">
                            <input class="form-control-custom" name="no" placeholder="Öğrenci Numarası" required autocomplete="off">
                            <!-- Hash/No SVG Icon -->
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14" />
                            </svg>
                        </div>

                        <button type="submit" class="btn-submit">Öğrenciyi Kaydet</button>
                    </form>
                </div>
            </div>

            <!-- Right Side: Students Table List -->
            <div class="col-lg-8">
                <div class="glass-card">
                    <h3 class="card-title-custom">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="20" height="20">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.109A12.018 12.018 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632v-.091m0-2.197a4.125 4.125 0 0 0-7.533 2.493M3.87 16.239A9.09 9.09 0 0 1 6 15c1.857-1.857 3.96-3 6-3m0 0a4.124 4.124 0 0 1 7.533-2.493M9 10.5a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0zM12 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                        </svg>
                        Kayıtlı Öğrenciler
                    </h3>

                    {{if .}}
                    <div class="table-responsive-custom">
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Adı Soyadı</th>
                                    <th>Öğrenci No</th>
                                </tr>
                            </thead>
                            <tbody>
                                {{range .}}
                                <tr>
                                    <td>#{{.ID}}</td>
                                    <td>
                                        <div class="d-flex align-items-center gap-3">
                                            <div class="avatar-circle">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                                </svg>
                                            </div>
                                            <span>{{.Name}}</span>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="badge-custom">{{.No}}</span>
                                    </td>
                                </tr>
                                {{end}}
                            </tbody>
                        </table>
                    </div>
                    {{else}}
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m0 0-.003-.037A6.07 6.07 0 0 1 12 12.75a6.07 6.07 0 0 1 6 5.969z" />
                        </svg>
                        <p>Kayıtlı öğrenci bulunmuyor.</p>
                        <span>Sisteme ilk öğrenciyi eklemek için sol taraftaki formu kullanabilirsiniz.</span>
                    </div>
                    {{end}}
                </div>
            </div>

        </div>
    </div>

</body>
</html>
